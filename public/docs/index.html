<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Paragliders Network – developers</title>
  <style>
    :root { --ink: #16181d; --soft: #5a6270; --bg: #fff; --code: #f3f4f6; --line: #e2e4e9; --link: #0047ff; }
    @media (prefers-color-scheme: dark) { :root { --ink: #eceef2; --soft: #a0a7b4; --bg: #15171b; --code: #22252b; --line: #33373f; --link: #7ea2ff; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
    nav { position: sticky; top: 0; display: flex; gap: 20px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
    nav a { color: var(--soft); text-decoration: none; font-weight: 600; }
    nav a.on { color: var(--ink); }
    main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; overflow-wrap: anywhere; }
    h1 { line-height: 1.2; } h2 { margin-top: 2em; } a { color: var(--link); }
    code { padding: 1px 4px; background: var(--code); border-radius: 4px; font-size: .9em; }
    pre { padding: 12px; overflow-x: auto; background: var(--code); border-radius: 8px; }
    pre code { padding: 0; background: none; }
    table { display: block; overflow-x: auto; border-collapse: collapse; }
    th, td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  </style>
</head>
<body>
  <nav><a href="#integration">Connect your app</a><a href="#protocol">Protocol</a><a href="/docs/example.mjs">example.mjs</a></nav>
  <main id="doc"></main>
  <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
  <script src="/docs/docs.js"></script>
</body>
</html>
