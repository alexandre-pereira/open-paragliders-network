<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Les pilotes de vol libre en direct : distance, triangles, traces du jour.">
  <title>Open Paragliders Network – en direct</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl-6.14.0/maplibre-gl.css">
  <link rel="stylesheet" href="/live/live.css">
</head>
<body>
  <aside id="side">
    <header>
      <h1 id="title"></h1>
      <span id="conn" class="dot"></span>
      <button id="aboutBtn" type="button" class="icon">?</button>
      <button id="fold" type="button" class="icon"></button>
    </header>
    <div class="tools">
      <input id="q" type="search" autocomplete="off">
      <div class="row">
        <label><span id="lSort"></span><select id="sort"></select></label>
        <label><span id="lRule"></span><select id="rule"></select></label>
      </div>
      <p id="count" class="muted"></p>
    </div>
    <ul id="list"></ul>
  </aside>

  <main id="map"></main>

  <section id="detail" class="card" hidden></section>

  <div id="about" class="overlay" hidden>
    <div class="card about">
      <button id="aboutClose" type="button" class="icon close">✕</button>
      <div id="aboutText"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-contour@0.1.1/dist/index.min.js" integrity="sha384-f2gK0HoDkM64k6ZBnbv6ZuvMzDqPOwrfTaIU9iv2BN7CWHyyTQJkPC9AoRNuuV39" crossorigin="anonymous"></script>
  <script type="module" src="/lib/maplibre.js" id="boot" data-load="/lib/basemap.js /lib/icons.js /lib/air3d.js /live/live.js!"></script>
</body>
</html>
